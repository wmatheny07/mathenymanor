user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 768;
        # multi_accept on;
}

http {

        ##
        # Basic Settings
        ##
        log_format cf_custom '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        '$http_cf_ray';

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 300;
        types_hash_max_size 2048;
        client_max_body_size 0;
        # server_tokens off;

        # server_names_hash_bucket_size 64;
        # server_name_in_redirect off;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ##
        # SSL Settings
        ##

        ssl_protocols TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
        ssl_prefer_server_ciphers off;

        ##
        # Logging Settings
        ##

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log debug;

        ##
        # Gzip Settings
        ##

        gzip on;

        # gzip_vary on;
        # gzip_proxied any;
        # gzip_comp_level 6;
        # gzip_buffers 16 8k;
        # gzip_http_version 1.1;
        # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        ##
        # Virtual Host Configs
        ##

# Upstream to abstract backend connection(s) for php
upstream php {
        server unix:/var/run/php/php8.0-fpm.sock;
        server 127.0.0.1:9000;
}

upstream homebridge {
	server ${HOST_IP}:8581;
}

upstream plex_upstream {
        server ${HOST_IP}:32400;
}

upstream filebrowser {
        server ${FILEBROWSER_IP}:8095;
}

upstream rclone_webdav {
        server ${RCLONE_IP}:8090;
}

upstream agent_api {
        server ${AGENTAPI_IP}:8000;
}

upstream agent_web {
        server ${AGENTWEB_IP}:80;
}

# upstream rclone_ui {
#     server 10.18.0.16:5572;  # RC Web UI port
# }

upstream minios3 {
        server ${MINIOS3_IP}:9005;
        keepalive 4;
}

upstream minio_console {
        server ${MINIOS3_IP}:9006;
}

upstream airflow {
        server ${AIRFLOW_IP}}:8080;
}

upstream health-api {
        server ${HEALTHAPI_IP}:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name agents.mathenymanor.com share.mathenymanor.com homebridge.mathenymanor.com minio.mathenymanor.com minios3.mathenymanor.com plex.mathenymanor.com mathenymanor.com www.mathenymanor.com airflow.mathenymanor.com;
    return 302 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name plex.*;
    resolver 127.0.0.11;

    client_max_body_size 0;
    proxy_redirect off;
    proxy_buffering off;

        # indicate locations of SSL key files.
        ssl_certificate         /etc/ssl/mathenymanor.com.pem;
        ssl_certificate_key     /etc/ssl/private/mathenymanor.com.key;
        ssl_client_certificate  /etc/ssl/certs/cloudflare.crt;
        ssl_verify_client on; 

    location / {
        set $upstream_proto http;
        proxy_pass $upstream_proto://plex_upstream;

        proxy_set_header X-Plex-Client-Identifier $http_x_plex_client_identifier;
        proxy_set_header X-Plex-Device $http_x_plex_device;
        proxy_set_header X-Plex-Device-Name $http_x_plex_device_name;
        proxy_set_header X-Plex-Platform $http_x_plex_platform;
        proxy_set_header X-Plex-Platform-Version $http_x_plex_platform_version;
        proxy_set_header X-Plex-Product $http_x_plex_product;
        proxy_set_header X-Plex-Token $http_x_plex_token;
        proxy_set_header X-Plex-Version $http_x_plex_version;
        proxy_set_header X-Plex-Nocache $http_x_plex_nocache;
        proxy_set_header X-Plex-Provides $http_x_plex_provides;
        proxy_set_header X-Plex-Device-Vendor $http_x_plex_device_vendor;
        proxy_set_header X-Plex-Model $http_x_plex_model;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name share.*;

    # indicate locations of SSL key files.
    ssl_certificate         /etc/ssl/mathenymanor.com.pem;
    ssl_certificate_key     /etc/ssl/private/mathenymanor.com.key;
    ssl_client_certificate  /etc/ssl/certs/cloudflare.crt;
    ssl_verify_client optional; 

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Buffering for large files
    proxy_buffering off;
#     client_max_body_size 4G;
    proxy_request_buffering off;

    location / {
    proxy_pass http://rclone_webdav;
    proxy_http_version 1.1;

    # Preserve methods like PROPFIND, MKCOL, etc.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Required for WebDAV to allow PUT, DELETE, MKCOL, PROPFIND
    proxy_set_header Connection "";
    proxy_buffering off;
#     client_max_body_size 4G;
    proxy_request_buffering off;

    # Timeouts for large uploads
    proxy_connect_timeout 600s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;
    }

