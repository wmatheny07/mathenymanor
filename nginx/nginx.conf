server {
    listen 443 ssl;
    server_name agents.*;

    ssl_certificate /etc/ssl/mathenymanor.com.pem;
    ssl_certificate_key /etc/ssl/private/mathenymanor.com.key;
    ssl_client_certificate  /etc/ssl/certs/cloudflare.crt;
    ssl_verify_client optional; 

    location /api/ {
        proxy_pass http://agent_api; # Flask backend
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers for browser requests
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Type' always;

        # Handle preflight OPTIONS request
        if ($request_method = 'OPTIONS') {
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        # Optional: disable buffering for large requests
        proxy_buffering off;
        proxy_request_buffering off;

        # Optional: increase timeouts for long-running API requests
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://agent_web; # React frontend
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
   listen       443 ssl;
   listen  [::]:443 ssl;
   server_name  airflow.*;

   # indicate locations of SSL key files.
        ssl_certificate         /etc/ssl/mathenymanor.com.pem;
        ssl_certificate_key     /etc/ssl/private/mathenymanor.com.key;
        ssl_client_certificate  /etc/ssl/certs/cloudflare.crt;
        ssl_verify_client on; 
        ssl_protocols TLSv1.3; # Dropping SSLv3, ref: POODLE
        ssl_prefer_server_ciphers off;
        
   # Allow special characters in headers
   ignore_invalid_headers off;
   # Allow any size file to be uploaded.
   # Set to a value such as 1000m; to restrict file size to a specific value
   client_max_body_size 0;
   # Disable buffering
   proxy_buffering off;
   proxy_request_buffering off;

   location / {
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-NginX-Proxy true;

      # This is necessary to pass the correct IP to be hashed
      real_ip_header X-Real-IP;

      proxy_connect_timeout 300;

      # To support websockets in MinIO versions released after January 2023
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      # Some environments may encounter CORS errors (Kubernetes + Nginx Ingress)
      # Uncomment the following line to set the Origin request to an empty string
      # proxy_set_header Origin '';

      chunked_transfer_encoding off;

      set $upstream_proto http;
      proxy_pass $upstream_proto://airflow;

   }
}

