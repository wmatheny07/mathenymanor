  redis:
    container_name: redis
    image: redis:7.2-bookworm
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always
    networks:
      - mathenymanor

  homebridge:
    image: homebridge/homebridge:latest
    container_name: homebridge
    restart: always
    volumes:
      - ./volumes/homebridge:/homebridge
    logging:
      driver: json-file
      options:
        max-size: "10mb"
        max-file: "1"
    network_mode: host

  rclone:
    image: rclone/rclone:latest
    container_name: rclone
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - /media/nasdrive/plexmedia:/data
    command: >
      serve webdav /data
      --addr :8090
      --user mathenymanor
      --pass ${RCLONE_PASS}
      --timeout 10m
      --server-write-timeout 4h
      --server-read-timeout 4h
      --vfs-cache-mode full
      --vfs-cache-max-size 50G
      --vfs-cache-max-age 12h
      --allow-origin "*"
      --read-only=false
    networks:
      - mathenymanor

  agent_api:
    build: ./agent_api
    container_name: agent-api
    ports:
      - "8000:8000"
    volumes:
      - ./agent_api/:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-https://agents.mathenymanor.com}
      # If agent_api needs redis, reference it by service name:
      # - REDIS_URL=redis://redis:6379/0
      # If agent_api needs health db, reference it by service name:
      # - HEALTH_DB_HOST=health-data-db
      # - HEALTH_DB_PORT=5432
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - mathenymanor

  agent_web:
    build:
      context: ./agent_web
      args:
        VITE_API_URL: "https://agents.mathenymanor.com/api"
    container_name: agent-web
    ports:
      - "3000:80"
    depends_on:
      - agent_api
    restart: unless-stopped
    environment:
      VITE_API_URL: "https://agents.mathenymanor.com/api"
    networks:
      - mathenymanor

volumes:
  postgres-db-volume:

networks:
  mathenymanor:
    name: mathenymanor.docker
    external: true