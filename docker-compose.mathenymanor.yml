volumes:
  postgres-db-volume:

networks:
  mathenymanor:
    name: mathenymanor.docker
    external: true
  core_data_net:
    external: true

services:
  plex:
    container_name: plex
    image: linuxserver/plex:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - PLEX_CLAIM=${PLEX_CLAIM}
      - VERSION=docker
    volumes:
      - /opt/plex/config:/config
      - /media/nasdrive/plexmedia/photos:/photos
      - /media/nasdrive/plexmedia/music:/music
      - /media/nasdrive/plexmedia/home_video:/home_video
      - /media/nasdrive/plexmedia/movies:/movies
      - /media/nasdrive/plexmedia/series:/series
    restart: unless-stopped
    network_mode: host

  homebridge:
    image: homebridge/homebridge:latest
    container_name: homebridge
    restart: always
    volumes:
      - ./volumes/homebridge:/homebridge
    logging:
      driver: json-file
      options:
        max-size: "10mb"
        max-file: "1"
    network_mode: host

  rclone:
    user: "1000:1000"
    image: rclone/rclone:latest
    container_name: rclone
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - /media/nasdrive/plexmedia:/data
    command: >
      serve webdav /data
      --addr :8090
      --user mathenymanor
      --pass ${RCLONE_PASS}
      --timeout 10m
      --server-write-timeout 4h
      --server-read-timeout 4h
      --vfs-cache-mode full
      --vfs-cache-max-size 50G
      --vfs-cache-max-age 12h
      --allow-origin "*"
      --read-only=false
    networks:
      - mathenymanor

  rclone_mail:
    user: "1000:1000"
    image: rclone/rclone:latest
    container_name: rclone-mail
    restart: unless-stopped
    ports:
      - "8091:8091"
    volumes:
      - /media/nasdrive/mail_intelligence/minio/mail-raw/inbox:/data
    command: >
      serve webdav /data
      --addr :8091
      --user mailuser
      --pass ${RCLONE_MAIL_PASS}
      --timeout 10m
      --server-write-timeout 4h
      --server-read-timeout 4h
      --vfs-cache-mode full
      --vfs-cache-max-size 10G
      --vfs-cache-max-age 12h
      --allow-origin "*"
      --read-only=false
    networks:
      - mathenymanor

  agent_api:
    build: ./agent_api
    container_name: agent-api
    ports:
      - "8000:8000"
    volumes:
      - ./agent_api/:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-https://agents.mathenymanor.com}
    restart: unless-stopped
    networks:
      - mathenymanor

  agent_web:
    build:
      context: ./agent_web
      args:
        VITE_API_URL: "https://agents.mathenymanor.com/api"
    container_name: agent-web
    ports:
      - "3000:80"
    depends_on:
      - agent_api
    restart: unless-stopped
    environment:
      VITE_API_URL: "https://agents.mathenymanor.com/api"
    networks:
      - mathenymanor
  
  health-api:
    build:
      context: ./health-api   # directory with your app.py & Dockerfile
    container_name: health-api
    restart: unless-stopped
    environment:
      MINIO_ENDPOINT: minio:9000             # whatever your MinIO service name:port is on the network
      MINIO_ACCESS_KEY: ${MINIO_MATHENYMANOR_USER}
      MINIO_SECRET_KEY: ${MINIO_MATHENYMANOR_PASSWORD}
      MINIO_BUCKET: health-data
      MINIO_SECURE: "false"                  # if MinIO is http inside MathenyManor
      HEALTH_API_KEY: ${HEALTH_API_KEY}      # same value you configure in AutoExportHealth
    ports:
      - "8088:8000"                          # host:container
    networks:
      - core_data_net