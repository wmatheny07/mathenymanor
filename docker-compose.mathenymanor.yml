services:
  plex:
    container_name: plex
    image: linuxserver/plex:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - PLEX_CLAIM=${PLEX_CLAIM}
      - VERSION=docker
    volumes:
      - /opt/plex/config:/config
      - /media/nasdrive/plexmedia/photos:/photos
      - /media/nasdrive/plexmedia/music:/music
      - /media/nasdrive/plexmedia/home_video:/home_video
      - /media/nasdrive/plexmedia/movies:/movies
      - /media/nasdrive/plexmedia/series:/series
    restart: unless-stopped
    network_mode: host

